          const w=document.createElement('div'); w.className='pkMenu';
          w.innerHTML = '<h2>🆕 غرفتك جاهزة</h2><p class="pkSub">أعطِ هذا الكود لصديقك يدخله بجهازه</p><div class="roomCodeBox">'+code+'</div><p class="pkSub">⏳ بانتظار انضمام صديقك...</p>';
          const backBtnEl=document.createElement('button'); backBtnEl.className='actionBtn secondary'; backBtnEl.textContent='⬅️ رجوع';
          backBtnEl.addEventListener('click', ()=>{ if(peer){ try{peer.destroy();}catch(e){} } peer=null; showModeSelect(); });
          w.appendChild(backBtnEl);
          container.appendChild(w);
        });
        p.on('connection', c=>{ conn=c; setupConnHandlers(true); });
        p.on('error', err=>{
          if(attempt<3 && String(err).indexOf('unavailable-id')!==-1){ attemptOpen(attempt+1); }
          else showOnlineError('صار خطأ بالاتصال. جرب مرة ثانية.');
        });
      }
    }

    function guestJoinScreen(){
      clear();
      const wrap=document.createElement('div'); wrap.className='pkMenu';
      wrap.innerHTML = '<h2>🔑 دخول لغرفة</h2><p class="pkSub">اكتب كود الغرفة اللي أعطاك ياه صديقك</p>';
      const inp=document.createElement('input'); inp.className='roomInput'; inp.maxLength=4; inp.inputMode='numeric'; inp.placeholder='0000';
      const btn=document.createElement('button'); btn.className='actionBtn'; btn.textContent='🚪 دخول'; btn.style.marginTop='14px';
      btn.addEventListener('click', ()=>{
        const code = inp.value.trim();
        if(code.length!==4) return;
        sfx('click'); joinRoom(code);
      });
      wrap.appendChild(inp); wrap.appendChild(document.createElement('br')); wrap.appendChild(btn);
      container.appendChild(wrap);
    }

    function joinRoom(code){
      clear();
      const w=document.createElement('div'); w.className='pkMenu';
      w.innerHTML = '<h2>🔄 جاري الاتصال...</h2>';
      container.appendChild(w);
      loadPeerJs().then(()=>{
        const p = new Peer();
        p.on('open', ()=>{
          peer=p;
          const c = p.connect('pk'+code, { reliable:true });
          conn=c;
          conn.on('open', ()=> setupConnHandlers(false));
          conn.on('error', ()=> showOnlineError('تعذر الاتصال بالغرفة. تأكد من الكود.'));
        });
        p.on('error', ()=> showOnlineError('تعذر الاتصال بالغرفة. تأكد من الكود.'));
      }).catch(()=> showOnlineError('تعذر تحميل خدمة الاتصال، تأكد من الإنترنت.'));
    }

    function showOnlineError(msg){
      clear();
      const w=document.createElement('div'); w.className='pkMenu';
      w.innerHTML = '<h2>⚠️ حدث خطأ</h2><p class="pkSub">'+msg+'</p>';
      const b=document.createElement('button'); b.className='actionBtn'; b.textContent='⬅️ رجوع';
      b.addEventListener('click', ()=>{ if(peer){ try{peer.destroy();}catch(e){} } peer=null; conn=null; showModeSelect(); });
      w.appendChild(b);
      container.appendChild(w);
    }

    function setupConnHandlers(hostSide){
      conn.on('data', data=> handleMessage(data));
      conn.on('close', ()=>{ if(!matchOver && !destroyed) showOnlineError('انقطع الاتصال بصديقك.'); });
      if(hostSide){
        showTeamSelect('A', ()=>{
          clear();
          const w=document.createElement('div'); w.className='pkMenu';
          w.innerHTML = '<h2>⏳ بانتظار صديقك...</h2><p class="pkSub">اخترت '+teamA.name+'. صديقك لسا يختار فريقه</p>';
          container.appendChild(w);
        });
      } else {
        clear();
        const w=document.createElement('div'); w.className='pkMenu';
        w.innerHTML = '<h2>✅ اتصلت بالغرفة</h2><p class="pkSub">اختر فريقك</p>';
        container.appendChild(w);
        showTeamSelectGuest();
      }
    }

    function showTeamSelectGuest(){
      const wrap=document.createElement('div'); wrap.className='pkMenu';
      const grid=document.createElement('div'); grid.className='teamGrid';
      TEAMS.forEach(t=>{
        const c=document.createElement('div'); c.className='teamCard';
        c.innerHTML = '<span class="tFlag">'+t.emoji+'</span><span class="tName">'+t.name+'</span><span class="tStar">⭐ '+t.star+'</span>';
        c.addEventListener('click', ()=>{
          sfx('click'); teamB=t;
          send({ type:'ready', team:t });
          clear();
          const w=document.createElement('div'); w.className='pkMenu';
          w.innerHTML = '<h2>⏳ بانتظار المضيف...</h2><p class="pkSub">اخترت '+t.name+'</p>';
          container.appendChild(w);
        });
        grid.appendChild(c);
      });
      wrap.appendChild(grid);
      container.appendChild(wrap);
    }

    function send(msg){ if(conn && conn.open){ try{ conn.send(msg); }catch(e){} } }

    function handleMessage(msg){
      if(!msg || !msg.type) return;
      if(isHost){
        if(msg.type==='ready'){
          teamB = msg.team;
          labelA = teamA.name; labelB = teamB.name;
          send({ type:'start', teamA, teamB });
          buildStage();
          setTimeout(runTurn, 600);
        } else if(msg.type==='shotInput'){
          if(pendingResolvers.shot){ const f=pendingResolvers.shot; pendingResolvers.shot=null; f(msg.shot); }
        } else if(msg.type==='diveInput'){
          if(pendingResolvers.dive){ const f=pendingResolvers.dive; pendingResolvers.dive=null; f(msg.dive); }
        }
      } else {
        if(msg.type==='start'){
          teamA=msg.teamA; teamB=msg.teamB; labelA=teamA.name; labelB=teamB.name;
          buildStage();
        } else if(msg.type==='yourTurnKick'){
          showKickerUI('أنت', shot=> send({ type:'shotInput', shot }));
        } else if(msg.type==='yourTurnDefend'){
          showDefendUI('أنت', dive=> send({ type:'diveInput', dive }));
        } else if(msg.type==='kickResult'){
          scoreA=msg.scoreA; scoreB=msg.scoreB; attemptsA=msg.attemptsA; attemptsB=msg.attemptsB; dotsA=msg.dotsA; dotsB=msg.dotsB;
          updateHud();
          animateAndShow(msg.shot, msg.dive, msg.scored, msg.kSide, ()=>{});
        } else if(msg.type==='matchOver'){
          scoreA=msg.scoreA; scoreB=msg.scoreB; matchOver=true;
          setTimeout(()=> showFinal(msg.winner), 700);
        }
      }
    }

    /* ---------- match stage ---------- */
    function buildStage(){
      clear();
      const wrap=document.createElement('div'); wrap.className='pkWrap';
      const hud=document.createElement('div'); hud.className='pkHud'; hud.id='pkHud';
      wrap.appendChild(hud);
      const stage=document.createElement('div'); stage.className='pkStage'; stage.id='pkStage';
      stage.innerHTML =
        '<div class="pkField"></div>'+
        '<div class="pkGoal"></div>'+
        '<div class="pkSpotHint"></div>'+
        '<div class="pkKeeper" id="pkKeeper">🧤</div>'+
        '<div class="pkBall" id="pkBall">⚽</div>'+
        '<div class="pkBanner" id="pkBanner"></div>'+
        '<div class="pkTimerWrap" id="pkTimerWrap" style="display:none"><div class="pkTimerBar" id="pkTimerBar"></div></div>';
      wrap.appendChild(stage);
      container.appendChild(wrap);
      kickIndex=0; scoreA=0; scoreB=0; attemptsA=0; attemptsB=0; dotsA=[]; dotsB=[]; matchOver=false;
      updateHud();
    }

    function updateHud(){
      const hud=document.getElementById('pkHud'); if(!hud) return;
      function dotsHtml(arr){
        let h=''; for(let i=0;i<5;i++){ const d=arr[i]; h+='<span class="pkDot '+(d==='goal'?'goal':(d==='miss'?'miss':''))+'"></span>'; }
        return h;
      }
      hud.innerHTML =
        '<div class="pkHudSide"><div class="pkTeamLbl">'+teamA.emoji+' '+labelA+'</div><div class="pkDots">'+dotsHtml(dotsA)+'</div><div style="font-weight:900">'+scoreA+'</div></div>'+
        '<div class="pkVs">VS</div>'+
        '<div class="pkHudSide"><div class="pkTeamLbl">'+teamB.emoji+' '+labelB+'</div><div class="pkDots">'+dotsHtml(dotsB)+'</div><div style="font-weight:900">'+scoreB+'</div></div>';
    }

    function setBanner(text, color){ const b=document.getElementById('pkBanner'); if(b){ b.textContent=text; b.style.color=color||'#ffd93b'; } }
    function clearControlZone(){
      const stage=document.getElementById('pkStage'); if(!stage) return;
      stage.querySelectorAll('.pkTouchPad,.pkCtrlRow,.pkDiveRow').forEach(el=>el.remove());
    }
    function resetBallKeeper(){
      const ball=document.getElementById('pkBall'), keeper=document.getElementById('pkKeeper');
      if(ball){ ball.style.left='50%'; ball.style.bottom='14%'; ball.style.transform='translate(-50%,0) scale(1)'; }
      if(keeper){ keeper.style.left='50%'; keeper.style.transform='translate(-50%,0)'; }
    }

    function showKickerUI(labelText, onShot){
      if(destroyed) return;
      clearControlZone();
      setBanner('🎯 دور '+labelText+' — سدد!', '#4ade80');
      resetBallKeeper();
      buildShootControls(onShot);
    }

    function buildShootControls(onShot){
      const stage=document.getElementById('pkStage'); if(!stage) return;
      const pad=document.createElement('div'); pad.className='pkTouchPad';
      const ctrlRow=document.createElement('div'); ctrlRow.className='pkCtrlRow';
      let used=false, dragging=false, sx=0, sy=0, st=0;
      function finish(shot){ if(used) return; used=true; pad.remove(); ctrlRow.remove(); onShot(shot); }

      pad.addEventListener('pointerdown', e=>{ dragging=true; sx=e.clientX; sy=e.clientY; st=performance.now(); try{ pad.setPointerCapture(e.pointerId); }catch(err){} });
      pad.addEventListener('pointerup', e=>{
        if(!dragging) return; dragging=false;
        const dx=e.clientX-sx, dyF=sy-e.clientY, dt=Math.max(16, performance.now()-st);
        if(dyF<15) return;
        const dist=Math.hypot(dx,dyF), speed=dist/dt;
        let tx=0.5+dx/140, ty=Math.min(1, dyF/160);
        const power=Math.max(0.15, Math.min(1, speed/0.9));
        const chip = speed<0.15 && dyF<95 && dyF>20 && Math.abs(dx)<40;
        const wide = tx<-0.06 || tx>1.06;
        tx=Math.max(-0.12, Math.min(1.12, tx));
        sfx('click');
        finish({ tx, ty, power, chip, wide });
      });
      stage.appendChild(pad);

      const switchBtn=document.createElement('button'); switchBtn.className='pkSwitchBtn';
      switchBtn.textContent = controlScheme==='swipe' ? '🕹️ استخدم دائرة الاتجاهات' : '👆 استخدم السحب باللمس';
      switchBtn.addEventListener('click', ()=>{ controlScheme = controlScheme==='swipe' ? 'dial' : 'swipe'; pad.remove(); ctrlRow.remove(); buildShootControls(onShot); });
      ctrlRow.appendChild(switchBtn);

      if(controlScheme==='dial'){
        pad.style.pointerEvents='none';
        dialPick=null; chipOn=false;
        const dial=document.createElement('div'); dial.className='pkDial';
        const cells=[
          {x:0,y:0,tx:0.15,ty:0.85,icon:'↖️'},{x:52,y:0,tx:0.5,ty:0.9,icon:'⬆️'},{x:104,y:0,tx:0.85,ty:0.85,icon:'↗️'},
          {x:0,y:52,tx:0.15,ty:0.25,icon:'↙️'},{x:52,y:52,tx:0.5,ty:0.3,icon:'⬇️'},{x:104,y:52,tx:0.85,ty:0.25,icon:'↘️'}
        ];
        cells.forEach(c=>{
          const cell=document.createElement('div'); cell.className='pkDialCell'; cell.style.left=c.x+'px'; cell.style.top=c.y+'px'; cell.textContent=c.icon;
          cell.addEventListener('click', ()=>{
            dial.querySelectorAll('.pkDialCell').forEach(x=>x.classList.remove('picked'));
            cell.classList.add('picked'); dialPick={ tx:c.tx, ty:c.ty };
          });
          dial.appendChild(cell);
        });
        ctrlRow.appendChild(dial);
        const chipBtn=document.createElement('button'); chipBtn.className='pkChipToggle'; chipBtn.textContent='🪁 بانينكا';
        chipBtn.addEventListener('click', ()=>{ chipOn=!chipOn; chipBtn.classList.toggle('on', chipOn); });
        ctrlRow.appendChild(chipBtn);
        let holding=false, holdStart=0;
        const shootBtn=document.createElement('button'); shootBtn.className='pkShootBtn'; shootBtn.textContent='🔫 اضغط مطول للتسديد';
        shootBtn.addEventListener('pointerdown', ()=>{ holding=true; holdStart=performance.now(); });
        const release=()=>{
          if(!holding) return; holding=false;
          const dur=performance.now()-holdStart;
          const power=Math.max(0.2, Math.min(1, dur/900));
          const pick = dialPick || { tx:0.5, ty:0.5 };
          sfx('click');
          finish({ tx:pick.tx, ty: chipOn?0.5:pick.ty, power: chipOn?0.35:power, chip: chipOn, wide:false });
        };
        shootBtn.addEventListener('pointerup', release);
        shootBtn.addEventListener('pointerleave', ()=>{ holding=false; });
        ctrlRow.appendChild(shootBtn);
      } else {
        const hint=document.createElement('div');
        hint.style.cssText='color:#fff;opacity:.9;font-size:12px;text-align:center;max-width:260px;background:rgba(0,0,0,0.4);padding:6px 12px;border-radius:12px;';
        hint.textContent='اسحب إصبعك من عند الكرة للأعلى باتجاه المرمى — سرعة السحب = قوة التسديدة، اسحب بخفة وبثبات لعمل بانينكا 🪁';
        ctrlRow.appendChild(hint);
      }
      stage.appendChild(ctrlRow);
    }

    function showDefendUI(labelText, onDive){
      if(destroyed) return;
      clearControlZone();
      setBanner('🧤 دور '+labelText+' — صد الكرة!', '#f87171');
      resetBallKeeper();
      const stage=document.getElementById('pkStage'); if(!stage) return;
      const timerWrap=document.getElementById('pkTimerWrap'), timerBar=document.getElementById('pkTimerBar');
      timerWrap.style.display='block'; timerBar.style.transition='none'; timerBar.style.width='100%';
      requestAnimationFrame(()=>{ timerBar.style.transition='width 1.8s linear'; timerBar.style.width='0%'; });
      const row=document.createElement('div'); row.className='pkDiveRow';
      let done=false;
      function finish(dive){ if(done) return; done=true; clearTimeout(autoT); timerWrap.style.display='none'; row.remove(); onDive(dive); }
      [{d:'left',icon:'⬅️'},{d:'mid',icon:'🧤'},{d:'right',icon:'➡️'}].forEach(o=>{
        const b=document.createElement('button'); b.className='pkDiveBtn'; b.textContent=o.icon;
        b.addEventListener('click', ()=>{ sfx('click'); finish(o.d); });
        row.appendChild(b);
      });
      stage.appendChild(row);
      const autoT=setTimeout(()=> finish('mid'), 1850);
    }

    function showPassDevice(lbl, kind, next){
      clearControlZone();
      setBanner('', '#fff');
      const stage=document.getElementById('pkStage'); if(!stage) return;
      const row=document.createElement('div'); row.className='pkCtrlRow';
      const box=document.createElement('div'); box.style.cssText='background:rgba(0,0,0,0.55);padding:16px 20px;border-radius:16px;text-align:center;';
      box.innerHTML = '<div style="font-size:15px;margin-bottom:10px">🔄 مرر الجهاز... دور <b>'+lbl+'</b> '+(kind==='shot'?'للتسديد ⚽':'للصد 🧤')+'</div>';
      const b=document.createElement('button'); b.className='actionBtn'; b.textContent='✅ جاهز';
      b.addEventListener('click', ()=>{ sfx('click'); row.remove(); next(); });
      box.appendChild(b); row.appendChild(box);
      stage.appendChild(row);
    }

    function animateAndShow(shot, dive, scored, kSide, cb){
      if(destroyed) return;
      clearControlZone();
      const ball=document.getElementById('pkBall'), keeper=document.getElementById('pkKeeper');
      const timerWrap=document.getElementById('pkTimerWrap'); if(timerWrap) timerWrap.style.display='none';
      const kickerLabel = kSide==='A' ? labelA : labelB;
      setBanner('⚽ '+kickerLabel+' يسدد...', '#ffd93b');
      const keeperOffset = dive==='left' ? -78 : (dive==='right' ? 78 : 0);
      if(keeper) keeper.style.transform = 'translate(calc(-50% + '+keeperOffset+'px), '+(dive==='mid'?0:6)+'px) rotate('+(dive==='left'?-18:(dive==='right'?18:0))+'deg)';
      const tx = shot.wide ? (shot.tx<0.5 ? -0.15 : 1.15) : Math.max(-0.15, Math.min(1.15, shot.tx));
      const ty = shot.chip ? 0.5 : shot.ty;
      const leftPct = 11 + tx*78;
      const bottomPct = 58 + ty*34;
      setTimeout(()=>{
        if(destroyed || !ball) return;
        ball.style.left = leftPct+'%'; ball.style.bottom = bottomPct+'%';
        ball.style.transform = 'translate(-50%,0) scale('+(shot.chip?0.85:0.7)+') rotate(360deg)';
      }, 60);
      setTimeout(()=>{
        if(destroyed) return;
        if(shot.wide){ setBanner('😬 تسديدة خارج المرمى!', '#f87171'); sfx('wrong'); }
        else if(scored){ setBanner('⚽ GOAL! هدف!', '#4ade80'); sfx('win'); }
        else { setBanner('🧤 تصدي رائع من الحارس!', '#f87171'); sfx('hit'); }
        cb();
      }, 680);
    }

    /* ---------- turn engine (runs for ai / local / online-host) ---------- */
    function kicker(idx){ return idx%2===0 ? 'A' : 'B'; }
    function decideStatus(){
      if(kickIndex===10){ if(scoreA!==scoreB) return { over:true, winner: scoreA>scoreB?'A':'B' }; return { over:false }; }
      if(kickIndex>10 && (kickIndex-10)%2===0){ if(scoreA!==scoreB) return { over:true, winner: scoreA>scoreB?'A':'B' }; }
      return { over:false };
    }

    function getInput(side, kind, cb){
      if(destroyed) return;
      if(mode==='ai'){
        if(side==='A'){ if(kind==='shot') showKickerUI('أنت', cb); else showDefendUI('أنت', cb); }
        else {
          clearControlZone();
          setBanner(kind==='shot' ? '🤖 الجهاز يستعد للتسديد...' : '🤖 الجهاز يستعد للصد...', '#94a3b8');
          setTimeout(()=>{ if(!destroyed) cb(kind==='shot' ? pkAiShot() : pkAiDive()); }, 700+Math.random()*500);
        }
      } else if(mode==='local'){
        const lbl = side==='A' ? labelA : labelB;
        showPassDevice(lbl, kind, ()=>{ if(kind==='shot') showKickerUI(lbl, cb); else showDefendUI(lbl, cb); });
      } else if(mode==='online'){
        if(side==='A'){ if(kind==='shot') showKickerUI(labelA, cb); else showDefendUI(labelA, cb); }
        else {
          send({ type: kind==='shot' ? 'yourTurnKick' : 'yourTurnDefend' });
          clearControlZone();
          setBanner(kind==='shot' ? ('⏳ '+labelB+' يسدد الآن...') : ('⏳ '+labelB+' يستعد للصد...'), '#94a3b8');
          if(kind==='shot') pendingResolvers.shot = cb; else pendingResolvers.dive = cb;
        }
      }
    }

    function applyResult(kSide, shot, dive, result){
      const scored = result.scored;
      if(kSide==='A'){ attemptsA++; if(scored) scoreA++; dotsA.push(scored?'goal':'miss'); }
      else { attemptsB++; if(scored) scoreB++; dotsB.push(scored?'goal':'miss'); }
      updateHud();
      animateAndShow(shot, dive, scored, kSide, ()=>{
        if(destroyed) return;
        if(mode==='online' && isHost) send({ type:'kickResult', shot, dive, scored, kSide, scoreA, scoreB, attemptsA, attemptsB, dotsA, dotsB });
        kickIndex++;
        const status = decideStatus();
        if(status.over){
          matchOver=true;
          if(mode==='online' && isHost) send({ type:'matchOver', winner:status.winner, scoreA, scoreB });
          setTimeout(()=>{ if(!destroyed) showFinal(status.winner); }, 700);
        } else {
          setTimeout(()=>{ if(!destroyed) runTurn(); }, 900);
        }
      });
    }

    function runTurn(){
      if(destroyed || matchOver) return;
      const kSide=kicker(kickIndex), dSide= kSide==='A' ? 'B' : 'A';
      getInput(kSide, 'shot', shot=>{
        getInput(dSide, 'dive', dive=>{
          const result = pkComputeOutcome(shot, dive);
          applyResult(kSide, shot, dive, result);
        });
      });
    }

    function showFinal(winner){
      clearControlZone();
      const winLabel = winner==='A' ? labelA : labelB;
      const overlayDiv=document.createElement('div'); overlayDiv.className='roundOverlay';
      overlayDiv.innerHTML = '<h2>🏆 فاز '+winLabel+'!</h2><p>النتيجة النهائية: '+teamA.name+' '+scoreA+' - '+scoreB+' '+teamB.name+'</p>';
      const b1=document.createElement('button'); b1.className='actionBtn'; b1.textContent='🔁 مباراة جديدة';
      b1.addEventListener('click', ()=>{ overlayDiv.remove(); if(mode==='online' && peer){ try{peer.destroy();}catch(e){} peer=null; conn=null; } showModeSelect(); });
      const b2=document.createElement('button'); b2.className='actionBtn secondary'; b2.textContent='🏠 القائمة';
      b2.addEventListener('click', ()=>{ overlayDiv.remove(); backBtn.click(); });
      overlayDiv.appendChild(b1); overlayDiv.appendChild(b2);
      sfx('win');
      const stage=document.getElementById('pkStage') || container;
      stage.appendChild(overlayDiv);
    }

    return function cleanup(){
      destroyed=true;
      if(peer){ try{ peer.destroy(); }catch(e){} }
      peer=null; conn=null;
    };
  }

})();
</script>
</body>
