<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ألعاب الذكاء الصوتي</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b); color: white;
            margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        h1 { color: #10B981; font-size: 2.5rem; margin-bottom: 40px; text-shadow: 0 0 20px rgba(16,185,129,0.4); }
        .games-grid { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
        .game-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 30px; width: 300px; text-align: center;
            transition: 0.3s; cursor: pointer; text-decoration: none; color: white;
        }
        .game-card:hover { transform: translateY(-10px); background: rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .icon { font-size: 4rem; margin-bottom: 15px; }
        .btn { background: #4F46E5; color: white; padding: 10px 20px; border-radius: 8px; border: none; font-size: 1.1rem; margin-top: 15px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎮 منصة التحديات الصوتية</h1>
    <div class="games-grid">
        <!-- اللعبة الأولى -->
        <a href="voice-game.html" class="game-card">
            <div class="icon">⚡</div>
            <h2>تحدي السرعة</h2>
            <p>أسرع شخص يجاوب على السؤال يحصل على النقاط.</p>
            <button class="btn">العب الآن</button>
        </a>
        <!-- اللعبة الثانية (الجديدة) -->
        <a href="family-feud.html" class="game-card">
            <div class="icon">👨‍👩‍👧‍👦</div>
            <h2>عائلة تربح</h2>
            <p>خمن الإجابات المخفية! 3 أخطاء وتنتقل الفرصة للخصم.</p>
            <button class="btn" style="background: #10B981;">العب الآن</button>
        </a>
    </div>
</body>
</html>
