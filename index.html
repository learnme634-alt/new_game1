<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي المعرفة الصوتي | أونلاين</title>
    <style>
        :root {
            --primary: #4F46E5; --success: #10B981; --danger: #EF4444; --warning: #F59E0B;
            --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.8);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: var(--bg-color); color: #f8fafc; margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .game-container {
            background: var(--card-bg); backdrop-filter: blur(15px); border-radius: 20px;
            padding: 30px; width: 100%; max-width: 650px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .lobby-box { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 20px; }
        .lobby-btn {
            background: var(--primary); color: white; border: none; padding: 12px 30px; font-size: 1.2rem;
            border-radius: 10px; cursor: pointer; transition: 0.3s; width: 100%; max-width: 300px;
        }
        .lobby-btn.join { background: var(--success); }
        .lobby-input {
            padding: 12px; font-size: 1.2rem; border-radius: 10px; border: 1px solid #475569;
            background: rgba(15, 23, 42, 0.6); color: white; text-align: center; width: 100%; max-width: 300px;
        }
        #lobby-status { margin-top: 15px; font-size: 1.1rem; color: #94a3b8; }
        
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 25px; font-size: 1.2rem; font-weight: bold; }
        .question-text { font-size: 1.8rem; margin: 30px 0; min-height: 80px; color: #e2e8f0; }
        .mic-btn {
            background: var(--primary); border: none; width: 90px; height: 90px; border-radius: 50%;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: 0.3s; box-shadow: 0 5px 20px rgba(79, 70, 229, 0.4); margin: 0 auto 20px;
        }
        .mic-btn svg { width: 40px; height: 40px; fill: white; }
        .mic-btn.listening { background: var(--success); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); } }
        .status { margin-bottom: 15px; font-size: 1.1rem; color: #94a3b8; min-height: 25px; }
        .feedback {
            padding: 15px; border-radius: 12px; font-size: 1.2rem; font-weight: bold;
            display: none; transition: 0.3s; margin-top: 20px; line-height: 1.6;
        }
        .feedback span.spoken { color: #f8fafc; font-weight: normal; font-size: 1.1rem; }
        .feedback span.correct-ans { color: #f8fafc; font-weight: bold; }
        
        #game-area { display: none; }
    </style>
</head>
<body>

<div class="game-container">
    
    <div id="lobby-area">
        <h1 style="color: var(--primary); margin-bottom: 10px;">تحدي المعرفة الصوتي</h1>
        <p>العب أونلاين مع صديقك مباشرة!</p>
        <div class="lobby-box">
            <button class="lobby-btn" onclick="createRoom()">إنشاء غرفة جديدة</button>
            <div style="margin: 10px 0; color: #64748b;">أو</div>
            <input type="text" id="roomCode" class="lobby-input" placeholder="أدخل رقم الغرفة هنا">
            <button class="lobby-btn join" onclick="joinRoom()">انضمام للغرفة</button>
        </div>
        <p id="lobby-status"></p>
    </div>

    <div id="game-area">
        <div class="top-bar">
            <div style="color: var(--success);">النقاط: <span id="score">0</span></div>
            <div style="color: #94a3b8; font-size: 1rem;" id="role-badge"></div>
        </div>
        
        <div class="question-text" id="question">جاري تجهيز السؤال...</div>
        
        <button class="mic-btn" id="mic-btn" onclick="toggleListening()" style="display: none;">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        
        <div class="status" id="status"></div>
        <div class="feedback" id="feedback"></div>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script>
    let peer = null;
    let conn = null;
    let isHost = false;
    let myRole = '';
    let questions = [];
    let currentIndex = 0;
    let scores = { host: 0, client: 0 };
    let recognition;
    let isListening = false;

    // 🎵 مولد الأصوات (مؤثرات صوتية بدون ملفات)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'start') {
            // صوت ظهور السؤال (تنبيه خفيف)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'correct') {
            // صوت الإجابة الصحيحة (رنة إيجابية)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'wrong') {
            // صوت الإجابة الخاطئة (بزر تحذيري)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
    }

    // 🎤 دالة فتح المايك تلقائياً
    function autoStartMic() {
        document.getElementById('status').innerText = "استعد للإجابة...";
        setTimeout(() => {
            if (recognition && !isListening) {
                try {
                    recognition.start();
                } catch(e) {
                    console.log("المايك يعمل بالفعل");
                }
            }
        }, 800); // يفتح المايك بعد 0.8 ثانية من ظهور السؤال
    }

    window.onload = async () => {
        try {
            const res = await fetch('questions.json');
            const data = await res.json();
            questions = data.sort(() => 0.5 - Math.random());
            initSpeech();
        } catch (e) {
            document.getElementById('lobby-status').innerText = 'خطأ: ملف الأسئلة questions.json غير موجود!';
        }
    };

    function createRoom() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const roomId = Math.floor(1000 + Math.random() * 9000);
        peer = new Peer('ahmedquiz-' + roomId);
        
        document.getElementById('lobby-status').innerText = 'جاري إنشاء الغرفة...';

        peer.on('open', () => {
            document.getElementById('lobby-status').innerHTML = `تم الإنشاء! أعطِ هذا الرقم لصديقك: <b style="font-size:26px; color:var(--success);">${roomId}</b><br>ننتظر دخول الخصم...`;
        });

        peer.on('connection', (connection) => {
            conn = connection;
            isHost = true;
            myRole = 'host';
            setupConnection();
            
            document.getElementById('lobby-area').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('role-badge').innerText = '(أنت صاحب الغرفة)';
            
            setTimeout(sendNextQuestion, 1500);
        });
    }

    function joinRoom() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const roomId = document.getElementById('roomCode').value;
        if(!roomId) return alert("الرجاء إدخال رقم الغرفة!");
        
        document.getElementById('lobby-status').innerText = 'جاري الاتصال بصديقك...';
        peer = new Peer();
        
        peer.on('open', () => {
            conn = peer.connect('ahmedquiz-' + roomId);
            
            conn.on('open', () => {
                isHost = false;
                myRole = 'client';
                setupConnection();
                
                document.getElementById('lobby-area').style.display = 'none';
                document.getElementById('game-area').style.display = 'block';
                document.getElementById('role-badge').innerText = '(أنت الضيف)';
            });
            
            conn.on('error', () => {
                document.getElementById('lobby-status').innerText = 'فشل الاتصال! تأكد من الرقم.';
            });
        });
    }

    function setupConnection() {
        conn.on('data', (data) => {
            if (data.type === 'question') {
                document.getElementById('question').innerText = data.qText;
                document.getElementById('feedback').style.display = 'none';
                document.getElementById('mic-btn').style.display = 'flex';
                
                playSound('start'); // صوت ظهور السؤال
                autoStartMic();     // تشغيل المايك تلقائياً
                
            } else if (data.type === 'submit') {
                if (isHost) checkAnswer(data.text, 'client');
            } else if (data.type === 'result') {
                handleResult(data);
            } else if (data.type === 'wrong') {
                handleWrong(data);
            } else if (data.type === 'game_over') {
                let myScore = scores[myRole];
                let oppScore = scores[myRole === 'host' ? 'client' : 'host'];
                document.getElementById('question').innerHTML = `🎉 انتهت اللعبة!<br>نقاطك: ${myScore} | الخصم: ${oppScore}`;
                document.getElementById('mic-btn').style.display = 'none';
                document.getElementById('status').style.display = 'none';
            }
        });
    }

    function normalizeText(text) {
        return text.trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\u064B-\u0652]/g, '').toLowerCase();
    }

    function checkAnswer(spokenText, senderRole) {
        const currentQ = questions[currentIndex];
        const normalizedSpoken = normalizeText(spokenText);
        const isCorrect = currentQ.accepted_answers.map(normalizeText).some(ans => normalizedSpoken.includes(ans));

        if (isCorrect) {
            scores[senderRole] += 10;
            const resultData = {
                type: 'result', winnerRole: senderRole, spokenText: spokenText,
                correctAnswer: currentQ.accepted_answers[0], scores: scores
            };
            handleResult(resultData);
            conn.send(resultData);
            currentIndex++;
            setTimeout(sendNextQuestion, 4000);
        } else {
            const wrongData = {
                type: 'wrong', spokenText: spokenText, correctAnswer: currentQ.accepted_answers[0]
            };
            if (senderRole === 'client') conn.send(wrongData);
            else handleWrong(wrongData);
        }
    }

    function sendNextQuestion() {
        if (currentIndex < questions.length) {
            const qData = { type: 'question', qText: questions[currentIndex].question };
            
            document.getElementById('question').innerText = qData.qText;
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('mic-btn').style.display = 'flex';
            
            playSound('start'); // صوت ظهور السؤال
            autoStartMic();     // تشغيل المايك تلقائياً
            
            conn.send(qData);
        } else {
            conn.send({ type: 'game_over' });
            let myScore = scores['host'];
            let oppScore = scores['client'];
            document.getElementById('question').innerHTML = `🎉 انتهت اللعبة!<br>نقاطك: ${myScore} | الخصم: ${oppScore}`;
            document.getElementById('mic-btn').style.display = 'none';
            document.getElementById('status').style.display = 'none';
        }
    }

    function handleResult(data) {
        scores = data.scores;
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        document.getElementById('score').innerText = scores[myRole];

        if (data.winnerRole === myRole) {
            playSound('correct'); // صوت الإجابة الصحيحة
            fb.style.background = 'rgba(16, 185, 129, 0.2)';
            fb.style.color = '#34d399';
            fb.innerHTML = `✅ أسرع إجابة صحيحة لك!<br><span class="spoken">قلت: "${data.spokenText}"</span>`;
        } else {
            playSound('wrong'); // صوت لخسارة النقطة
            fb.style.background = 'rgba(239, 68, 68, 0.2)';
            fb.style.color = '#f87171';
            fb.innerHTML = `❌ الخصم سبقك وجاوب صحيح!<br><span class="spoken">الخصم قال: "${data.spokenText}"</span><br><span class="correct-ans">الإجابة: ${data.correctAnswer}</span>`;
        }
        
        if(isListening) {
            isListening = false;
            recognition.stop();
        }
        document.getElementById('mic-btn').style.display = 'none';
    }

    function handleWrong(data) {
        playSound('wrong'); // صوت الإجابة الخاطئة
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        fb.style.background = 'rgba(245, 158, 11, 0.2)';
        fb.style.color = '#fbbf24';
        
        fb.innerHTML = `⚠️ إجابة خاطئة!<br>
                       <span class="spoken">أنت قلت: "${data.spokenText}"</span><br>
                       <span class="correct-ans">الإجابة الصحيحة هي: ${data.correctAnswer}</span><br>
                       <span style="font-size: 0.9rem; color: #cbd5e1; margin-top: 10px; display: inline-block;">(ننتظر إجابة الخصم أو السؤال التالي...)</span>`;
        
        if(isListening) {
            isListening = false;
            recognition.stop();
        }
    }

    function initSpeech() {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'ar-IQ';
            recognition.continuous = false;
            
            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('listening');
                document.getElementById('status').innerText = "جاري الاستماع... 🎤";
                document.getElementById('feedback').style.display = 'none'; 
            };
            
            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript;
                if (isHost) {
                    checkAnswer(spokenText, 'host'); 
                } else {
                    conn.send({ type: 'submit', text: spokenText }); 
                }
            };
            
            recognition.onerror = () => stopListening();
            recognition.onend = () => stopListening();
        } else {
            alert("متصفحك لا يدعم التعرف الصوتي. استخدم Google Chrome.");
        }
    }

    function toggleListening() {
        if (!recognition) return;
        if (isListening) {
            isListening = false;
            recognition.stop();
        } else recognition.start();
    }

    function stopListening() {
        isListening = false;
        document.getElementById('mic-btn').classList.remove('listening');
        if(document.getElementById('status').innerText.includes("جاري الاستماع")) {
            document.getElementById('status').innerText = "اضغط على المايك للإجابة";
        }
    }
</script>
</body>
</html>
