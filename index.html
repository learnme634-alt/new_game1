<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي المعرفة الصوتي | أونلاين</title>
    <style>
        :root {
            --primary: #4F46E5; --success: #10B981; --danger: #EF4444; --warning: #F59E0B;
            --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.8);
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: var(--bg-color); color: #f8fafc; margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .game-container {
            background: var(--card-bg); backdrop-filter: blur(15px); border-radius: 20px;
            padding: 30px; width: 100%; max-width: 650px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 25px; font-size: 1.2rem; font-weight: bold; }
        .question-text { font-size: 1.8rem; margin: 30px 0; min-height: 80px; color: #e2e8f0; }
        .mic-btn {
            background: var(--primary); border: none; width: 90px; height: 90px; border-radius: 50%;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            transition: 0.3s; box-shadow: 0 5px 20px rgba(79, 70, 229, 0.4); margin: 0 auto 20px;
        }
        .mic-btn svg { width: 40px; height: 40px; fill: white; }
        .mic-btn.listening { background: var(--success); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); } }
        .status { margin-bottom: 15px; font-size: 1.1rem; color: #94a3b8; min-height: 25px; }
        .feedback {
            padding: 15px; border-radius: 12px; font-size: 1.2rem; font-weight: bold;
            display: none; transition: 0.3s; margin-top: 20px; line-height: 1.6;
        }
        .feedback span.spoken { color: #f8fafc; font-weight: normal; font-size: 1.1rem; }
        .feedback span.correct-ans { color: #f8fafc; font-weight: bold; }
        #game-area { display: block; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="game-area">
        <div class="top-bar">
            <div style="color: var(--success);">نقاطي: <span id="score">0</span></div>
        </div>
        
        <div class="question-text" id="question">جاري الاتصال بالسيرفر...</div>
        
        <button class="mic-btn" id="mic-btn" onclick="toggleListening()" style="display: none;">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        
        <div class="status" id="status"></div>
        <div class="feedback" id="feedback"></div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // ⚠️ ضع رابط السيرفر الخاص بك هنا
    const socket = io('https://voice-game-server.onrender.com'); 
    
    let recognition;
    let isListening = false;
    let myId = null;

    socket.on('connect', () => { myId = socket.id; });
    
    socket.on('status_message', (msg) => {
        document.getElementById('status').innerText = msg;
        if(msg.includes('ننتظر')) document.getElementById('question').innerText = "في انتظار الخصم...";
    });

    socket.on('new_question', (questionText) => {
        document.getElementById('question').innerText = questionText;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('mic-btn').style.display = 'flex';
        document.getElementById('status').innerText = "اضغط على المايك للإجابة";
    });

    socket.on('answer_result', (data) => {
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        document.getElementById('score').innerText = data.scores[myId] || 0;

        if (data.winnerId === myId) {
            fb.style.background = 'rgba(16, 185, 129, 0.2)';
            fb.style.color = '#34d399';
            fb.innerHTML = `✅ أسرع إجابة صحيحة لك!<br><span class="spoken">قلت: "${data.spokenText}"</span>`;
        } else {
            fb.style.background = 'rgba(239, 68, 68, 0.2)';
            fb.style.color = '#f87171';
            fb.innerHTML = `❌ الخصم سبقك وجاوب صحيح!<br><span class="spoken">الخصم قال: "${data.spokenText}"</span><br><span class="correct-ans">الإجابة: ${data.correctAnswer}</span>`;
        }
        
        if(isListening) toggleListening();
        document.getElementById('mic-btn').style.display = 'none';
    });

    // 🌟 التحديث الجديد: عرض ما قاله اللاعب إذا كانت الإجابة خاطئة مع ذكر الإجابة الصحيحة
    socket.on('wrong_answer', (data) => {
        const fb = document.getElementById('feedback');
        fb.style.display = 'block';
        fb.style.background = 'rgba(245, 158, 11, 0.2)'; // لون تحذيري (برتقالي/أصفر)
        fb.style.color = '#fbbf24';
        
        // عرض ما قاله اللاعب والإجابة الصحيحة كما طلبت
        fb.innerHTML = `⚠️ إجابة خاطئة!<br>
                       <span class="spoken">أنت قلت: "${data.spokenText}"</span><br>
                       <span class="correct-ans">الإجابة الصحيحة هي: ${data.correctAnswer}</span><br>
                       <span style="font-size: 0.9rem; color: #cbd5e1; margin-top: 10px; display: inline-block;">(ننتظر إجابة الخصم أو السؤال التالي...)</span>`;
        
        // إيقاف المايك مؤقتاً لتجنب التشويش
        if(isListening) toggleListening();
    });

    socket.on('game_over', (scores) => {
        document.getElementById('question').innerHTML = `🎉 انتهت الأسئلة!<br>نقاطك: ${scores[myId] || 0}`;
        document.getElementById('mic-btn').style.display = 'none';
        document.getElementById('status').style.display = 'none';
    });

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.lang = 'ar-IQ';
        recognition.continuous = false;
        
        recognition.onstart = () => {
            isListening = true;
            document.getElementById('mic-btn').classList.add('listening');
            document.getElementById('status').innerText = "جاري الاستماع... 🎤";
            document.getElementById('feedback').style.display = 'none'; // إخفاء الفيدباك السابق عند بدء استماع جديد
        };
        
        recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript;
            socket.emit('submit_answer', spokenText);
        };
        
        recognition.onerror = () => stopListening();
        recognition.onend = () => stopListening();
    } else {
        document.getElementById('question').innerText = "متصفحك لا يدعم التعرف الصوتي. يرجى استخدام Chrome.";
    }

    function toggleListening() {
        if (!recognition) return;
        if (isListening) recognition.stop();
        else recognition.start();
    }

    function stopListening() {
        isListening = false;
        document.getElementById('mic-btn').classList.remove('listening');
        if(document.getElementById('status').innerText.includes("جاري الاستماع")) {
            document.getElementById('status').innerText = "اضغط على المايك للإجابة";
        }
    }
</script>
</body>
</html>
