<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عائلة تربح | أونلاين</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #3b82f6; --wrong: #ef4444; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); color: white; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; text-align: center; }
        
        .top-bar { display: flex; justify-content: space-between; background: var(--card); padding: 15px 20px; border-radius: 15px; margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; border: 1px solid rgba(255,255,255,0.1); }
        .turn-badge { color: #fbbf24; font-size: 1.5rem; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        
        .question { font-size: 1.8rem; margin: 20px 0; color: #e2e8f0; }
        
        /* تصميم البطاقات المخفية (Flip Cards) */
        .board { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .card-container { perspective: 1000px; height: 60px; }
        .card { width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; position: relative; cursor: pointer; }
        .card.flipped { transform: rotateX(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 1.4rem; font-weight: bold; }
        .card-front { background: linear-gradient(180deg, #1e3a8a, #1e40af); border: 2px solid #3b82f6; color: #93c5fd; }
        .card-back { background: linear-gradient(180deg, #065f46, #047857); border: 2px solid #10b981; transform: rotateX(180deg); color: white; justify-content: space-between; padding: 0 20px; }
        
        /* الإكسات (الأخطاء) */
        .strikes { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; font-size: 3rem; color: #334155; }
        .strikes span.active { color: var(--wrong); animation: pop 0.3s; text-shadow: 0 0 20px red; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }

        /* المايكروفون */
        .mic-btn { background: var(--primary); border: none; width: 80px; height: 80px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 0 auto; transition: 0.3s; }
        .mic-btn svg { width: 35px; height: 35px; fill: white; }
        .mic-btn.listening { background: #10B981; animation: pulse 1s infinite; }
        .mic-btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.5; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0; } }
        
        #lobby { background: var(--card); padding: 30px; border-radius: 20px; margin-top: 50px; }
        .input-code { padding: 10px; font-size: 1.2rem; width: 200px; text-align: center; margin-bottom: 15px; }
        button.btn { padding: 10px 20px; font-size: 1.1rem; cursor: pointer; background: var(--primary); color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- اللوبي -->
    <div id="lobby">
        <h1 style="color: #10B981;">عائلة تربح 👨‍👩‍👧‍👦</h1>
        <button class="btn" onclick="createRoom()">إنشاء غرفة</button>
        <p>أو</p>
        <input type="text" id="roomCode" class="input-code" placeholder="رقم الغرفة"><br>
        <button class="btn" style="background: #10B981;" onclick="joinRoom()">انضمام</button>
        <p id="lobby-status"></p>
    </div>

    <!-- ساحة اللعب -->
    <div id="game-area" style="display: none;">
        <div class="top-bar">
            <div>نقاطي: <span id="my-score">0</span></div>
            <div class="turn-badge" id="turn-indicator">ننتظر بدء اللعبة...</div>
            <div>الخصم: <span id="opp-score">0</span></div>
        </div>

        <div style="font-size: 1.2rem; color: #10b981;">نقاط الجولة الحالية: <span id="round-bank" style="font-weight: bold; font-size: 1.5rem;">0</span></div>
        
        <div class="question" id="question">جاري التحميل...</div>
        
        <!-- البطاقات (الأجوبة) -->
        <div class="board" id="board"></div>
        
        <!-- الأخطاء -->
        <div class="strikes" id="strikes">
            <span id="x1">✖</span><span id="x2">✖</span><span id="x3">✖</span>
        </div>

        <button class="mic-btn" id="mic-btn" onclick="toggleListening()">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        <p id="status-text">اضغط على المايك للإجابة</p>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script>
    // 💡 بنك أسئلة "عائلة تربح" (الجواب عليه نقاط، ولازم تخمن كل الأجوبة)
    const questionsDB = [
        {
            question: "شيء تأخذه معك دائماً عند السفر؟",
            answers: [
                { text: "ملابس", points: 40, accepted: ["ملابس", "هدوم", "ملابسي"] },
                { text: "فلوس / بطاقة", points: 30, accepted: ["فلوس", "مال", "بطاقه", "فلوسي"] },
                { text: "جواز سفر", points: 20, accepted: ["جواز", "باسبورت", "جواز سفر"] },
                { text: "شاحنة التلفون", points: 10, accepted: ["شاحنه", "شاحن", "شاحنه تلفون"] }
            ]
        },
        {
            question: "شيء موجود في كل بيت عراقي؟",
            answers: [
                { text: "قوري چاي", points: 35, accepted: ["قوري", "جاي", "چاي", "شاي"] },
                { text: "مبردة", points: 30, accepted: ["مبرده", "مكيف"] },
                { text: "صوبة", points: 20, accepted: ["صوبه", "مدفاه"] },
                { text: "تلفزيون", points: 15, accepted: ["تلفزيون", "شاشه"] }
            ]
        }
    ];

    let peer, conn, isHost = false, myRole = '';
    let recognition, isListening = false;
    
    // 🔥 حالة اللعبة (السيرفر/الهوست هو اللي يتحكم بيها ويدزها للخصم)
    let state = {
        qIndex: 0,
        turn: 'host',       // منو إله الدور؟ 'host' أو 'client'
        phase: 'normal',    // 'normal' أو 'steal' (خطف)
        strikes: 0,
        revealed: [],       // الأرقام اللي انكشفت
        roundBank: 0,
        scores: { host: 0, client: 0 }
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if(type === 'correct') {
            osc.type = 'square'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if(type === 'wrong') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    function createRoom() {
        const roomId = Math.floor(1000 + Math.random() * 9000);
        peer = new Peer('family-' + roomId);
        document.getElementById('lobby-status').innerText = 'جاري الإنشاء...';
        peer.on('open', () => {
            document.getElementById('lobby-status').innerHTML = `أعطِ هذا الرقم لصديقك: <b>${roomId}</b>`;
        });
        peer.on('connection', (connection) => {
            conn = connection; isHost = true; myRole = 'host';
            startGame();
        });
    }

    function joinRoom() {
        const roomId = document.getElementById('roomCode').value;
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect('family-' + roomId);
            conn.on('open', () => {
                isHost = false; myRole = 'client';
                startGame();
            });
        });
    }

    function startGame() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        initSpeech();
        
        conn.on('data', (data) => {
            if (data.type === 'updateState') {
                state = data.state;
                renderBoard(); // تحديث الشاشة بناءً على أوامر الهوست
            } else if (data.type === 'submit' && isHost) {
                processAnswer(data.text); // الكلاينت يدز جوابه للهوست حتى يفحصه
            }
        });

        if (isHost) {
            state.qIndex = 0;
            updateAndSendState();
        }
    }

    // 🧠 العقل المدبر للعبة (يشتغل فقط عند الـ Host لمنع الغش)
    function processAnswer(spokenText) {
        let q = questionsDB[state.qIndex];
        let normalized = spokenText.trim().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').toLowerCase();
        
        let foundIndex = -1;
        for (let i = 0; i < q.answers.length; i++) {
            let accepted = q.answers[i].accepted.map(a => a.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه'));
            if (accepted.some(ans => normalized.includes(ans)) && !state.revealed.includes(i)) {
                foundIndex = i; break;
            }
        }

        if (foundIndex !== -1) {
            // إجابة صحيحة!
            playSound('correct');
            state.revealed.push(foundIndex);
            state.roundBank += q.answers[foundIndex].points;
            
            // هل انكشفت كل الأجوبة؟
            if (state.revealed.length === q.answers.length) {
                // الفائز بالجولة هو اللي كان يلعب
                state.scores[state.turn] += state.roundBank;
                setTimeout(nextQuestion, 3000);
            } else if (state.phase === 'steal') {
                // نجح بالخطف!
                state.scores[state.turn] += state.roundBank;
                setTimeout(nextQuestion, 3000);
            }
        } else {
            // إجابة خاطئة (إكس ✖)
            playSound('wrong');
            
            if (state.phase === 'normal') {
                state.strikes++;
                if (state.strikes >= 3) {
                    // تحويل الدور للخصم (فرصة الخطف)
                    state.turn = (state.turn === 'host') ? 'client' : 'host';
                    state.phase = 'steal';
                    state.strikes = 0; // تصفير الإكسات لفرصة الخطف
                }
            } else if (state.phase === 'steal') {
                // فشل بالخطف، النقاط ترجع للفريق الأصلي
                let originalTeam = (state.turn === 'host') ? 'client' : 'host';
                state.scores[originalTeam] += state.roundBank;
                setTimeout(nextQuestion, 3000);
            }
        }
        updateAndSendState();
    }

    function nextQuestion() {
        state.qIndex++;
        if (state.qIndex < questionsDB.length) {
            state.revealed = []; state.roundBank = 0; state.strikes = 0;
            state.phase = 'normal'; state.turn = 'host'; // الدور يرجع للهوست بداية كل جولة
            updateAndSendState();
        } else {
            document.getElementById('question').innerText = "انتهت اللعبة!";
        }
    }

    function updateAndSendState() {
        renderBoard();
        conn.send({ type: 'updateState', state: state });
    }

    // 🎨 رسم الواجهة بناءً على حالة اللعبة
    function renderBoard() {
        let q = questionsDB[state.qIndex];
        document.getElementById('question').innerText = q.question;
        document.getElementById('round-bank').innerText = state.roundBank;
        document.getElementById('my-score').innerText = scores = state.scores[myRole];
        document.getElementById('opp-score').innerText = state.scores[myRole === 'host' ? 'client' : 'host'];
        
        // رسم البطاقات
        let boardHTML = '';
        for (let i = 0; i < q.answers.length; i++) {
            let isFlipped = state.revealed.includes(i) ? 'flipped' : '';
            boardHTML += `
                <div class="card-container">
                    <div class="card ${isFlipped}">
                        <div class="card-face card-front">${i + 1}</div>
                        <div class="card-face card-back">
                            <span>${q.answers[i].text}</span>
                            <span>${q.answers[i].points}</span>
                        </div>
                    </div>
                </div>
            `;
        }
        document.getElementById('board').innerHTML = boardHTML;

        // رسم الإكسات
        document.getElementById('x1').className = state.strikes >= 1 ? 'active' : '';
        document.getElementById('x2').className = state.strikes >= 2 ? 'active' : '';
        document.getElementById('x3').className = state.strikes >= 3 ? 'active' : '';

        // التحكم بالدور والمايكروفون
        let turnText = (state.turn === myRole) ? "🔥 دورك للإجابة!" : "⏳ دور الخصم...";
        if (state.phase === 'steal') turnText += (state.turn === myRole) ? " (فرصة خطف!)" : " (الخصم يحاول الخطف)";
        
        document.getElementById('turn-indicator').innerText = turnText;
        
        const micBtn = document.getElementById('mic-btn');
        if (state.turn !== myRole) {
            micBtn.disabled = true; // قفل المايك إذا مو دورك
            if(isListening) { recognition.stop(); isListening = false; }
            document.getElementById('status-text').innerText = "انتظر دورك...";
        } else {
            micBtn.disabled = false;
            document.getElementById('status-text').innerText = "اضغط للحديث";
        }
    }

    function initSpeech() {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'ar-IQ'; recognition.continuous = false;
            
            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('listening');
                document.getElementById('status-text').innerText = "جاري الاستماع...";
            };
            
            recognition.onresult = (event) => {
                let spoken = event.results[0][0].transcript;
                if (isHost) processAnswer(spoken);
                else conn.send({ type: 'submit', text: spoken });
            };
            recognition.onend = () => { isListening = false; document.getElementById('mic-btn').classList.remove('listening'); };
        }
    }

    function toggleListening() {
        if (state.turn !== myRole) return; // منع تشغيل المايك إذا مو دورك
        if (isListening) recognition.stop(); else recognition.start();
    }
</script>
</body>
</html>
